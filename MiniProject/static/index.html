<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Trithemius</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="top-nav">
        <span id="user-display" class="user-tag" style="display:none;">USER: GUEST</span>
        <button class="nav-btn" onclick="checkAuthAndToggleHistory()">🕒 HISTORY</button>
        <button id="logout-btn" class="nav-btn logout" onclick="logout()" style="display:none;">LOGOUT</button>
    </div>

    <div id="login-modal" class="modal-overlay">
        <div class="login-card">
            <button class="close-modal" onclick="closeModal()">×</button>
            <div class="login-header">
                <h2 id="modal-title">ACCESS VAULT</h2>
                <p>Login to Save History & Share Files</p>
            </div>
            
            <a href="/google/login" class="social-btn google">
                <i class="fab fa-google"></i> Google
            </a>
            <a href="/github/login" class="social-btn github">
                <i class="fab fa-github"></i> GitHub
            </a>

            <div class="divider"><span>OR</span></div>

            <div id="login-form">
                <input type="email" id="login-email" placeholder="Email Address" class="auth-input">
                <input type="password" id="login-pass" placeholder="Password" class="auth-input">
                <button class="auth-submit-btn" onclick="performLogin()">SIGN IN</button>
                <p class="switch-auth">New here? <a onclick="switchMode('register')">Create Account</a></p>
            </div>

            <div id="register-form" style="display:none;">
                <input type="text" id="reg-name" placeholder="Full Name" class="auth-input">
                <input type="email" id="reg-email" placeholder="Email Address" class="auth-input">
                <input type="password" id="reg-pass" placeholder="Create Password" class="auth-input">
                <button class="auth-submit-btn" onclick="performRegister()">REGISTER</button>
                <p class="switch-auth">Have an account? <a onclick="switchMode('login')">Sign In</a></p>
            </div>
            <div id="auth-error" class="auth-error"></div>
        </div>
    </div>

    <div id="history-panel" class="history-panel">
        <div class="history-header">
            <h3>SECURE LOGS</h3>
            <button onclick="closeHistory()">×</button>
        </div>
        <div id="history-list" class="history-list"></div>
    </div>

    <div class="scene">
        <div class="card" id="main-card">
            
            <div class="card-face card-front">
                <header>
                    <div class="status-badge">SYSTEM ONLINE</div>
                    <h1>VAULT // LOCK</h1>
                </header>
                <div class="content-body">
                    <div class="input-group">
                        <label>SOURCE IMAGE</label>
                        <div class="file-input-wrapper drop-zone" id="drop-encode">
                            <input type="file" id="upload-encode" accept="image/*" class="hidden-input">
                            <label for="upload-encode" class="custom-file-btn"><span>📂 SELECT IMAGE</span></label>
                            <span id="file-name-encode" class="file-name-display">No file selected</span>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>PAYLOAD</label>
                        <textarea id="secret-message" placeholder="Input secret data..."></textarea>
                        <input type="password" id="pass-encode" class="password-input" placeholder="ENCRYPTION KEY">
                    </div>

                    <button class="action-btn" onclick="encodeMessage()">ENCRYPT & DOWNLOAD</button>
                    
                    <div id="encode-actions" class="share-actions" style="display: none; margin-top: 10px;">
                        <button onclick="checkAuthAndShare()" class="share-btn">
                            <i class="fas fa-share-alt"></i> SHARE ENCRYPTED FILE
                        </button>
                    </div>

                    <div id="encode-status" class="status">Ready</div>
                </div>
                <button class="flip-btn" onclick="flipCard()">SWITCH TO DECRYPT ↻</button>
            </div>

            <div class="card-face card-back">
                <header>
                    <div class="status-badge warning">DECRYPT MODE</div>
                    <h1>VAULT // UNLOCK</h1>
                </header>
                <div class="content-body">
                    <div class="input-group">
                        <label>TARGET ARTIFACT</label>
                        <div class="file-input-wrapper drop-zone" id="drop-decode">
                            <input type="file" id="upload-decode" accept="image/*" class="hidden-input">
                            <label for="upload-decode" class="custom-file-btn"><span>🔓 SELECT IMAGE</span></label>
                            <span id="file-name-decode" class="file-name-display">No file selected</span>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>SECURITY CLEARANCE</label>
                        <input type="password" id="pass-decode" class="password-input" placeholder="DECRYPTION KEY">
                        <div class="output-box"><p id="decoded-output" class="result-text">Awaiting Authorization...</p></div>
                    </div>
                    <button class="action-btn" onclick="decodeMessage()">DECRYPT ARTIFACT</button>
                </div>
                <button class="flip-btn" onclick="flipCard()">↻ SWITCH TO ENCRYPT</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
